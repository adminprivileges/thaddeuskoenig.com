name: Build and Deploy Hugo Site

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HUGO_VERSION: 0.164.0
      GO_VERSION: 1.26.4
      NODE_VERSION: 24.18.0
      DART_SASS_VERSION: 1.101.0
      HUGO_ENVIRONMENT: production
      TZ: America/New_York

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dart Sass
        run: |
          mkdir -p "${HOME}/.local"

          curl -sfL \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
            -o "${{ runner.temp }}/dart-sass.tar.gz"

          tar -C "${HOME}/.local" \
            -xf "${{ runner.temp }}/dart-sass.tar.gz"

          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

      - name: Install Hugo
        run: |
          mkdir -p "${HOME}/.local/hugo"

          curl -sfL \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" \
            -o "${{ runner.temp }}/hugo.tar.gz"

          tar -C "${HOME}/.local/hugo" \
            -xf "${{ runner.temp }}/hugo.tar.gz"

          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Display tool versions
        run: |
          hugo version
          go version
          node --version
          npm --version
          sass --version

      - name: Install Node.js dependencies
        run: npm ci --install-strategy=hoisted

      - name: Build Hugo site
        run: |
          hugo build \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/hugo_cache"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
